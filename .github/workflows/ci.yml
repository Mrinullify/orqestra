name: Orqestra CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/mcp-server

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          # Prisma generate needs a syntactically valid URL, but does not connect to the database.
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orqestra

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test -- --runInBand

      - name: Build production application
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orqestra
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orqestra
          GROQ_API_KEY: ci-placeholder-not-a-real-secret
          RESEND_API_KEY: re_placeholder_for_ci_build
